services:
  my_app:
    build: 
      context: .
    image: chatbot:latest
    container_name: chatbot
    stdin_open: true
    tty: true
    ports:
      - "3000:3000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      sh -c "ollama serve & sleep 3 && ollama pull llama3.2 && tail -f /dev/null"

volumes:
  ollama_data: