<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat with Bot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .chat-container {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      height: 80vh;
    }
    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      border-bottom: 1px solid #eee;
    }
    .chat-input-area {
      display: flex;
      padding: 16px;
      background: #fafafa;
    }
    .chat-input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1em;
    }
    .send-btn {
      margin-left: 10px;
      padding: 10px 18px;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1em;
      cursor: pointer;
    }
    .send-btn:active {
      background: #005fa3;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-messages" id="chatMessages">
      <!-- Messages will appear here -->
    </div>
    <form class="chat-input-area" id="chatForm" autocomplete="off">
      <input type="text" class="chat-input" id="chatInput" placeholder="Type your message..." required />
      <button type="submit" class="send-btn">Send</button>
    </form>
  </div>
  <script>
    document.getElementById('chatForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      if (message !== '') {
        appendMessage('🗣️: ' + message);
        input.value = '';

        try {
          const response = await fetch('http://localhost:8000/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message })
          });

          const data = await response.json();
          appendMessage('🤖: ' + data.response);
        } catch (error) {
          appendMessage('⚠️: Error communicating with server');
          console.error(error);
        }
      }
    });

    function appendMessage(msg) {
      const msgDiv = document.createElement('div');
      msgDiv.textContent = msg;
      document.getElementById('chatMessages').appendChild(msgDiv);
      document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
    }
  </script>
</body>
</html>
